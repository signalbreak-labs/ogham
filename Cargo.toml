[workspace]
members = [
    "crates/ogham-core",
    "crates/ogham",
    "crates/ogham-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/signalbreak-labs/ogham"
authors = ["VerifiedOrganic"]
rust-version = "1.85"

[workspace.dependencies]
ogham-core = { path = "crates/ogham-core" }
ogham = { path = "crates/ogham" }

async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

fjall = "2"

axum = "0.8"
tower = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
