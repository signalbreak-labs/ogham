name: Release

# Tag-driven releases: push a tag `vX.Y.Z` that matches the workspace
# version and this workflow verifies, creates the GitHub release with
# notes from CHANGELOG.md, and attaches ogham-server binaries.
# Releases are GitHub-only; see RELEASING.md to enable crates.io.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag & gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ogham") | .version')
          echo "tag=$TAG_VERSION cargo=$CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match workspace version $CARGO_VERSION"
            exit 1
          fi
      - name: Gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test -p ogham --features tiktoken

  create-release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          title: Ogham $version
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: Binary (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ogham-server
          target: ${{ matrix.target }}
          archive: ogham-server-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # crates.io publishing is intentionally disabled — releases are
  # GitHub-only for now. To enable: create a crates.io API token with
  # publish scope, add it as the CARGO_REGISTRY_TOKEN repository secret,
  # and restore the publish job (see RELEASING.md "Publishing to
  # crates.io" for the job definition).
