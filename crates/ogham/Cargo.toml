[package]
name = "ogham"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "LLM context engineering SDK: reversible compression, agent-aware rules, token budgets"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Default keeps both embedded CCR backends so existing builds are unchanged.
# Build with `--no-default-features` for a lean dependency set (in-memory CCR
# only); opt back into the heavy stores with `ccr-sqlite` / `ccr-fjall`.
default = ["ccr-sqlite", "ccr-fjall"]
tiktoken = ["dep:tiktoken-rs"]
# Persistent CCR stores, each pulling a heavy backend only when enabled.
ccr-sqlite = ["dep:rusqlite"]
ccr-fjall = ["dep:fjall"]

[dependencies]
ogham-core = { workspace = true }

async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

tiktoken-rs = { version = "0.12", optional = true }

blake3 = "1"
regex = "1"
md5 = "0.8"
flate2 = "1"
fjall = { version = "2", optional = true }
rusqlite = { version = ">=0.38, <0.41", features = ["bundled"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "compress"
harness = false
