[package]
name = "ogham"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "LLM context engineering SDK: reversible compression, agent-aware rules, token budgets"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Lean by default: in-memory CCR only, no heavy embedded backends. Opt into a
# persistent store with `ccr-sqlite` and/or `ccr-fjall`. (Through 0.3 these were
# on by default; see CHANGELOG for the 0.4 migration.)
default = []
tiktoken = ["dep:tiktoken-rs"]
# Persistent CCR stores, each pulling a heavy backend only when enabled.
ccr-sqlite = ["dep:rusqlite"]
ccr-fjall = ["dep:fjall"]

[dependencies]
ogham-core = { workspace = true }

async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

tiktoken-rs = { version = "0.12", optional = true }

blake3 = "1"
regex = "1"
md5 = "0.8"
flate2 = "1"
fjall = { version = "3", optional = true }
rusqlite = { version = ">=0.38, <0.41", features = ["bundled"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "compress"
harness = false
